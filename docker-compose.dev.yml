services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sopla-runframe-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    restart: unless-stopped
